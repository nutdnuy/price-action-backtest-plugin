[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price-action-backtest-plugin"
version = "0.1.0"
description = "Claude Code and Codex plugin for price-action backtests and visualization reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nuthdanai Wangpratham" }]
dependencies = []

[project.optional-dependencies]
runtime = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.22.0"
]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
